<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Libro</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1b2e46;
        }

        label {
            display: block;
            margin: 0.5rem 0 0.2rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 1rem;
        }

        button {
            width: 100%;
            background-color: #be2621;
            color: #fff;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #991e1b;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${book.id != null} ? 'Editar Libro' : 'Agregar Libro'"></h1>
    <form th:action="@{/books}" th:object="${book}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <label for="title">Título</label>
        <input type="text" th:field="*{title}" id="title"/>

        <label for="author">Autor</label>
        <input type="text" th:field="*{author}" id="author"/>

        <label for="genre">Género</label>
        <input type="text" th:field="*{genre}" id="genre"/>

        <label for="year">Año</label>
        <input type="number" th:field="*{year}" id="year"/>

        <button type="submit">Guardar</button>
    </form>
</div>
</body>
</html>
